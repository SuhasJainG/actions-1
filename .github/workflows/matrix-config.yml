name: Matrix Configuration

on: 
  push: 
  workflow_dispatch: 

jobs:
  deploy:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        images: [hello-world,alpine]
        exclude:
          - os: windows-latest
          - images: alpine

        include:
          - os: ubuntu-20.04
          - images: amd64/alpine
    runs-on: ${matrix.os}
    steps:
      - name: Echo docker info
        run: docker info

      - name: Run docker {{matrix.images}}
        run: docker run {{matrix.images}}
