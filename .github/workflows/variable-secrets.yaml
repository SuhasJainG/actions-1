name: Variables and secrets

on: 
  workflow_dispatch: 

env:
  CONTAINER_REGISTRY: docker.io
  IMAGE_NAME: github-action-nginx

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker build
        run: |
          echo docker build -t ${CONTAINER_REGISTRY}/${{vars.DOCKER_USERNAME}}/${IMAGE_NAME}

      - name: Docker login
        run: |
          echo docker login -u ${CONTAINER_REGISTRY}/${{vars.DOCKER_USERNAME}}/${{vars.DOCKER_PW}}

  deploy:
   needs: docker
   runs-on: ubuntu-latest
   steps:
     - name: docker build
       run: echo deploy -d ${CONTAINER_REGISTRY}

     - name: sleep
       run: sleep 600

